spring:
  config:
    import: optional:file:.env.prod[.properties]
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      auto-commit: false
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${DDL_AUTO:validate}
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    baseline-on-migrate: ${FLYWAY_BASELINE_ON_MIGRATE:true}
    baseline-version: ${FLYWAY_BASELINE_VERSION:1}

file:
  photo-max-size: ${PHOTO_MAX_SIZE:5242880}
  file-max-size: ${FILE_MAX_SIZE:5242880}
  upload-dir: ${FILE_UPLOAD_DIR}
  photo-dir: ${PHOTO_UPLOAD_DIR}

app:
  swagger:
    enabled: false
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

server:
  ssl:
    enabled: ${SERVER_SSL_ENABLED:true}
