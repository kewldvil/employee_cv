spring:
  application:
    name: employee_cv
  profiles:
    default: dev
  servlet:
    multipart:
      max-file-size: ${MULTIPART_MAX_FILE_SIZE:10MB}
      max-request-size: ${MULTIPART_MAX_REQUEST_SIZE:30MB}
  web:
    resources:
      static-locations: classpath:/static/
      cache:
        period: ${STATIC_CACHE_PERIOD:3600}

server:
  forward-headers-strategy: framework
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false

jwt:
  secret-key: ${JWT_SECRET_KEY}
  expiration: ${JWT_EXPIRATION:900000}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:P7D}
  refresh-cookie-secure: ${JWT_REFRESH_COOKIE_SECURE:true}

file:
  report-dir: ${REPORT_DIR:classpath:/}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

app:
  swagger:
    enabled: false
  security:
    login-rate-limit:
      capacity: ${LOGIN_RATE_LIMIT_CAPACITY:10}
      refill-tokens: ${LOGIN_RATE_LIMIT_REFILL_TOKENS:10}
      refill-duration: ${LOGIN_RATE_LIMIT_REFILL_DURATION:PT1M}
  seed:
    enabled: ${APP_SEED_ENABLED:false}
    reset-non-admin-passwords: ${APP_SEED_RESET_NON_ADMIN_PASSWORDS:false}
    rotate-existing-admin-password: ${APP_SEED_ROTATE_EXISTING_ADMIN_PASSWORD:false}
    admin:
      username: ${ADMIN_USERNAME:}
      password: ${ADMIN_PASSWORD:}
      email: ${ADMIN_EMAIL:admin@local.invalid}
      firstname: ${ADMIN_FIRSTNAME:Admin}
      lastname: ${ADMIN_LASTNAME:User}
