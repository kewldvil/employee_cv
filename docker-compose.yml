services:
  app:
    image: 'docker-spring-boot-postgres:latest'
    restart: always
    build:
      context: .
    container_name: app
    depends_on:
      - db
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${DB_NAME:-officer_cv}
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      SPRING_JPA_HIBERNATE_DDL_AUTO: ${DDL_AUTO:-validate}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY is required}
    ports:
      - "8080:8080"

  db:
    image: postgres
    restart: always
    container_name: db
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      POSTGRES_DB: ${DB_NAME:-officer_cv}
    ports:
      - "5432:5432"

  angular-app:
    build:
      context: ../noc-officer-cv-ui
      dockerfile: Dockerfile
    container_name: angular-app
    ports:
      - "80:80"
    restart: always
